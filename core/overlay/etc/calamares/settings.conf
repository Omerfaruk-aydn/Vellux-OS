---
# Vellux OS kurulum sihirbazi (Calamares 3.3)
modules-search: [ local ]

instances:
- id:       postinstall
  module:   shellprocess
  config:   shellprocess_postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - users
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@postinstall
  - removeuser
  - umount
- show:
  - finished

branding: vellux

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
