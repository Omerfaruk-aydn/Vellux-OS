---
defaultGroups:
    - users
    - sudo
    - adm
    - cdrom
    - plugdev
    - video
    - audio
    - input
    - render
    - netdev
    - bluetooth
    - lpadmin
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false
availableShells: /bin/bash
userShell:       /bin/bash
passwordRequirements:
    minLength: 6
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "vellux-${first}"
    forbidden_names: [ localhost ]
