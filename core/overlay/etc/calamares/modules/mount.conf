---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:3, space_cache=v2 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]

# Geri alma (vellux-update) ve kullanici verisinin korunmasi icin ayri alt birimler
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots
btrfsSwapSubvolume: /@swap
