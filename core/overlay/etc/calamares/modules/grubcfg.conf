---
overwrite: false
prefer_grub_d: false
always_use_defaults: false
kernel_params: [ "quiet", "splash", "loglevel=3", "vt.global_cursor_default=0" ]
defaults:
    GRUB_TIMEOUT: 3
    GRUB_TIMEOUT_STYLE: "hidden"
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
