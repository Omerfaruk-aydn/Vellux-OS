# ==============================================================================
# VELLUX OS DESKTOP COMPOSITOR CONFIGURATION
# Engine: wlroots Wayland Compositor (Floating Glass Architecture)
# Target: 120Hz/144Hz VRR Display, Pure Wayland
# ==============================================================================

# Modifier Key (Mod4 = Super / Command / Windows Key)
set $mod Mod4

# Font configuration
font pango:Inter, SF Pro Display, sans-serif 10

# Output & Display Sync
output * bg #07090f solid_color

# Default Window Behavior: Floating by default for Apple macOS feel
for_window [app_id=".*"] floating enable
for_window [class=".*"] floating enable

# Window Borders & Gaps
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders none
gaps inner 8
gaps outer 12

# Color Palette (Matches Vellux Glass Tokens)
# class                 border    bground   text      indicator child_border
client.focused          #ffffff40 #0f1424e0 #ffffff   #0a84ff   #ffffff30
client.focused_inactive #ffffff15 #0a0d18d0 #ffffffa0 #0a84ff   #ffffff10
client.unfocused        #ffffff0a #07090fd0 #ffffff60 #07090f   #ffffff05
client.urgent           #ff453a   #ff453ae0 #ffffff   #ff453a   #ff453a

# Input & Trackpad Configuration
input type:touchpad {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    accel_profile adaptive
}

input type:keyboard {
    xkb_layout "tr,us"
    xkb_options "grp:alt_shift_toggle"
}

# Keybindings: Human Interface Shortcuts
# Spotlight Search HUD (Super + Space or Ctrl + Space)
bindsym $mod+space exec wofi --show drun --conf /etc/vellux/wofi/config --style /etc/vellux/wofi/style.css
bindsym Ctrl+space exec wofi --show drun --conf /etc/vellux/wofi/config --style /etc/vellux/wofi/style.css

# Launch Terminal (Super + Return)
bindsym $mod+Return exec foot

# Launch Browser (Super + B)
bindsym $mod+b exec sh -c "which chromium-browser chromium google-chrome firefox 2>/dev/null | head -n 1 | xargs -r -I {} {} https://www.google.com"

# Close Window (Super + Q or Alt + F4)
bindsym $mod+q kill
bindsym Mod1+F4 kill

# Drag floating windows by holding Super and Left Mouse Button
floating_modifier $mod normal

# Autostart Desktop Components
exec_always waybar -c /etc/vellux/waybar/config.jsonc -s /etc/vellux/waybar/style.css
exec_always swaybg -m fill -c "#07090f"

# Launch welcome terminal on startup
exec foot --title="Vellux Welcome" -e bash -c "echo -e '\e[38;2;56;189;248m'; cat /etc/os-release; echo -e '\e[0m\nWelcome to \e[1;38;2;56;189;248mVellux OS\e[0m!\n'; if grep -q boot=live /proc/cmdline; then echo -e 'Live session: type \e[1mvellux-install\e[0m (or click Install in the top bar) to install to disk.\n'; fi; echo -e 'System tools: \e[1mvellux-update status\e[0m | \e[1mvellux-update upgrade\e[0m\n'; exec /bin/bash"
