# ==============================================================================
# VELLUX COMPOSITOR SPECIFICATION (Wayland Native)
# Hardware: DRM/KMS Atomic Direct-Scanout, Vulkan/EGL Pipeline
# Visual: Real-Time Dual-Kawase Glassmorphism, 18px Radii, Spring Bezier Curves
# ==============================================================================

# Monitor & Refresh Sync (Targeting 120Hz/144Hz tear-free displays)
monitor=,preferred,auto,1,vrr,1

# Input & Gesture Calibration (Apple Magic Trackpad 1:1 Response)
input {
    kb_layout = tr,us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
        scroll_factor = 0.85
    }
    sensitivity = 0.05
    accel_profile = adaptive
}

# General Layout & Surface Metrics
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    
    # Specular 1px edge reflections (simulates top-lit beveled glass edges)
    col.active_border = rgba(ffffff45) rgba(ffffff10) 45deg
    col.inactive_border = rgba(ffffff0a)

    layout = dwindle
    no_focus_fallback = true
}

# The Heart of Vellux: Dual-Kawase Glassmorphism Decoration Pass
decoration {
    rounding = 16
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    # Real-Time Multi-Pass Dual-Kawase GPU Background Blur
    blur {
        enabled = true
        size = 14
        passes = 4
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 1.15
        brightness = 1.05
        vibrancy = 0.25
        vibrancy_darkness = 0.15
        special = true
        popups = true
    }

    # Ambient Soft Drop Shadows for 3D Elevation
    drop_shadow = true
    shadow_range = 36
    shadow_render_power = 4
    col.shadow = rgba(00000065)
    shadow_offset = 0 14
}

# Physics-Driven Spring Animations (Hooke's Law Easing Presets)
animations {
    enabled = yes

    # Calibrated Mass-Spring Bezier Curves
    bezier = velluxSpring, 0.16, 1.0, 0.3, 1.0
    bezier = velluxOvershoot, 0.34, 1.35, 0.64, 1.0
    bezier = velluxSubtle, 0.25, 1.0, 0.5, 1.0

    # Layer & Window Animation Bindings
    animation = windows, 1, 4.5, velluxOvershoot, popin 85%
    animation = windowsOut, 1, 3.5, velluxSpring, popin 90%
    animation = windowsMove, 1, 4.0, velluxSpring
    animation = border, 1, 6.0, default
    animation = fade, 1, 3.0, velluxSubtle
    animation = workspaces, 1, 5.0, velluxSpring, slide
    animation = specialWorkspace, 1, 4.0, velluxOvershoot, slidevert
}

# Gestures (1:1 Touchpad Workspace Transitions)
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 280
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_cancel_ratio = 0.4
}

# Layer Rules for Native Glass Shell (Top Bar, Floating Dock, Control Center)
layerrule = blur, vellux-dock
layerrule = ignorezero, vellux-dock
layerrule = blur, vellux-bar
layerrule = ignorezero, vellux-bar
layerrule = blur, vellux-control-center
layerrule = ignorezero, vellux-control-center
layerrule = blur, vellux-launcher
