name: Vellux OS Cloud Build Farm & Live ISO Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # STEP 1: RUST SUBSYSTEMS COMPILATION & UNIT TEST VERIFICATION
  # ============================================================================
  build-rust-subsystems:
    name: Compile & Verify Native Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libzstd-dev libwayland-dev pkg-config

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile All Native Crates (Release Mode)
        run: cargo build --workspace --release --verbose

      - name: Run Test Suite (Physics Solver & SAT Resolver)
        run: cargo test --workspace --verbose

      - name: Archive Built Native Binaries
        uses: actions/upload-artifact@v4
        with:
          name: vellux-native-binaries
          path: |
            target/release/vellux-pkg
            target/release/vellux-compositor
            target/release/vellux-shell
            target/release/vellux-term
            target/release/vellux-files
            target/release/vellux-settings

  # ============================================================================
  # STEP 2: ASSEMBLE FULL PRODUCTION ROOTFS (KERNEL + MESA + DRIVERS) & MASTER ISO
  # ============================================================================
  master-live-iso:
    name: Build Live Linux Rootfs & Master ISO
    needs: build-rust-subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install ISO Mastering Toolchain & Debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools debootstrap

      - name: Download Compiled Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: vellux-native-binaries
          path: bin-artifacts

      - name: Make Binaries Executable
        run: chmod +x bin-artifacts/*

      - name: Bootstrap Full Production Rootfs with Linux Kernel & Drivers
        run: |
          chmod +x core/boot/bootstrap-rootfs.sh
          ./core/boot/bootstrap-rootfs.sh ./rootfs

      - name: Install Vellux Native Binaries, Services & Shaders into Rootfs
        run: |
          # Install compiled native binaries
          sudo cp bin-artifacts/vellux-pkg rootfs/usr/bin/
          sudo cp bin-artifacts/vellux-compositor rootfs/usr/bin/
          sudo cp bin-artifacts/vellux-shell rootfs/usr/bin/
          sudo cp bin-artifacts/vellux-term rootfs/usr/bin/
          sudo cp bin-artifacts/vellux-files rootfs/usr/bin/
          sudo cp bin-artifacts/vellux-settings rootfs/usr/bin/

          # Install compositor configurations & GLSL shaders
          sudo mkdir -p rootfs/etc/vellux/shaders
          sudo cp compositor/config/vellux-comp.conf rootfs/etc/vellux/
          sudo cp compositor/shaders/dual_kawase.frag rootfs/etc/vellux/shaders/

          # Install systemd session unit for automatic graphical login
          sudo cp core/services/vellux-session.service rootfs/etc/systemd/system/
          sudo chroot rootfs systemctl enable vellux-session.service || true
          sudo chroot rootfs systemctl set-default graphical.target || true

          # Basic system identification
          cat << 'EOF' | sudo tee rootfs/etc/os-release > /dev/null
          NAME="Vellux OS"
          PRETTY_NAME="Vellux OS 1.0 (Wayland 144Hz Fluid Glass)"
          ID=vellux
          ID_LIKE=linux
          VERSION="1.0"
          HOME_URL="https://github.com/Omerfaruk-aydn/Vellux-OS"
          EOF

      - name: Build Hybrid UEFI/BIOS ISO Image
        run: |
          mkdir -p iso_root/boot/grub
          
          # Compress rootfs to Zstandard SquashFS
          sudo mksquashfs rootfs iso_root/live/filesystem.squashfs -comp zstd -Xcompression-level 19

          # Write GRUB configuration
          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=5
          insmod efi_gop
          insmod font
          insmod gfxterm
          set gfxmode=auto
          terminal_output gfxterm

          menuentry "Start Vellux OS 1.0 (Wayland 144Hz Fluid Glass)" {
              echo "Booting Vellux OS Production Kernel..."
              linux /live/vmlinuz boot=live console=tty0
              initrd /live/initrd.img
          }

          menuentry "Start Vellux OS (Safe Graphics / Software Fallback)" {
              linux /live/vmlinuz boot=live nomodeset console=tty0
              initrd /live/initrd.img
          }
          EOF

          # Generate hybrid ISO using xorriso / grub-mkrescue
          mkdir -p dist
          sudo grub-mkrescue -o dist/Vellux-OS-1.0-x86_64.iso iso_root

      - name: Upload Finished ISO Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellux-OS-Live-ISO
          path: dist/Vellux-OS-1.0-x86_64.iso

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-full
          name: "Vellux OS 1.0.0 Full Production Live Release"
          body: |
            ### 🌌 Vellux OS 1.0.0 Production Live ISO

            This is a complete, bootable Linux operating system image ready to flash onto a USB flash drive (via BalenaEtcher or Rufus) or run directly in VirtualBox / QEMU / VMware.

            #### 🛠 Integrated Core Stack:
            - **Kernel:** Linux 6.8+ Generic with DRM/KMS, live-boot & Zstandard SquashFS
            - **Graphics:** Mesa 24+ Vulkan/OpenGL drivers (Intel Iris/Xe, AMD Radeon, Nvidia Nouveau)
            - **Display Server:** Pure Wayland native direct-scanout compositor (144Hz VRR)
            - **Shaders:** Hardware-accelerated Dual-Kawase GLSL background blur
            - **Audio:** PipeWire & WirePlumber ultra-low-latency sound architecture
            - **Network:** NetworkManager & wpa_supplicant
            - **Package Engine:** `vellux-pkg` with SQLite3 WAL database & topological dependency resolver
            - **Native Apps Suite:**
              * `vellux-term`: GPU-accelerated glass terminal
              * `vellux-files`: Native glass file manager (Finder)
              * `vellux-settings`: Hardware & visual display preferences
            
            #### 🔑 Default Credentials:
            - **Username:** `vellux`
            - **Password:** `vellux` (Auto-login enabled into Wayland session)
          files: dist/Vellux-OS-1.0-x86_64.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
