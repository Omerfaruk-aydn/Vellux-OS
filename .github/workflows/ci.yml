name: Vellux OS Cloud Build Farm & Live ISO Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # STEP 1: RUST SUBSYSTEMS COMPILATION & UNIT TEST VERIFICATION
  # ============================================================================
  build-rust-subsystems:
    name: Compile & Verify Native Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libzstd-dev libwayland-dev pkg-config

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile All Native Crates (Release Mode)
        run: cargo build --workspace --release --verbose

      - name: Run Test Suite (Physics Solver & SAT Resolver)
        run: cargo test --workspace --verbose

      - name: Archive Built Native Binaries
        uses: actions/upload-artifact@v4
        with:
          name: vellux-native-binaries
          path: |
            target/release/vellux-pkg
            target/release/vellux-compositor
            target/release/vellux-shell
            target/release/vellux-term
            target/release/vellux-files
            target/release/vellux-settings

  # ============================================================================
  # STEP 2: SYSTEM LAYER VALIDATION (static checks, fast feedback)
  # ============================================================================
  validate-system-layer:
    name: Validate System Layer (scripts, configs, assets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Shell syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for f in core/boot/*.sh core/overlay/usr/bin/vellux-*; do
            echo "bash -n $f"; bash -n "$f"
          done
          shellcheck -S error core/boot/build-iso.sh core/overlay/usr/bin/vellux-*

      - name: Configuration syntax (YAML / JSON)
        run: python3 tools/validate-configs.py

      - name: Generate visual assets (Plymouth, Calamares)
        run: |
          python3 core/boot/plymouth/gen-assets.py build/assets
          test -s build/assets/plymouth/logo.png
          test -s build/assets/calamares/welcome.png

  # ============================================================================
  # STEP 3: ASSEMBLE FULL PRODUCTION ROOTFS & MASTER ISO
  # ============================================================================
  master-live-iso:
    name: Build Vellux OS Base System & Master ISO
    needs: [build-rust-subsystems, validate-system-layer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install ISO Mastering Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools debootstrap rsync python3

      - name: Download Compiled Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: vellux-native-binaries
          path: bin-artifacts

      - name: Make Scripts and Binaries Executable
        run: chmod +x bin-artifacts/* core/boot/*.sh

      - name: Build Rootfs and ISO (core/boot/build-iso.sh)
        run: ./core/boot/build-iso.sh

      - name: Upload Finished ISO Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellux-OS-Live-ISO
          path: dist/Vellux-OS-1.1-x86_64.iso

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-base
          name: "Vellux OS 1.1.0 Base System"
          body: |
            ### Vellux OS 1.1.0 - Layer 1: System Foundation

            Bootable live + installable ISO (UEFI and BIOS).

            - **Kernel:** Linux 6.8 with modules-extra, full linux-firmware, CPU microcode
            - **Drivers:** Mesa Vulkan/GL, Wi-Fi/Bluetooth stack, PipeWire audio, VirtualBox/VMware/QEMU guest tools, automatic NVIDIA driver setup
            - **Installer:** Calamares with Vellux branding - Btrfs subvolumes, optional LUKS full-disk encryption, GRUB (UEFI + Secure Boot shim)
            - **Security:** AppArmor, UFW firewall (default deny incoming), kernel hardening sysctls, live sudo removed on install
            - **Updates:** `vellux-update` with automatic Btrfs snapshots before every package operation and one-command rollback
            - **Boot:** Plymouth Vellux theme (animated logo, progress bar, LUKS passphrase prompt), quiet GRUB
            - **Memory:** zram compressed swap, systemd-oomd
            - **Browser:** Firefox from the Mozilla apt repository (no snap)

            Live session user: `live` / password `live`. Run `vellux-install` (or the Install button in the top bar) to install.
          files: dist/Vellux-OS-1.1-x86_64.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
