name: Vellux OS Cloud Build Farm & Live ISO Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # STEP 1: RUST SUBSYSTEMS COMPILATION & UNIT TEST VERIFICATION
  # ============================================================================
  build-rust-subsystems:
    name: Compile & Verify Native Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libzstd-dev libwayland-dev pkg-config

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile All Native Crates (Release Mode)
        run: cargo build --workspace --release --verbose

      - name: Run Test Suite (Physics Solver & SAT Resolver)
        run: cargo test --workspace --verbose

      - name: Archive Built Native Binaries
        uses: actions/upload-artifact@v4
        with:
          name: vellux-native-binaries
          path: |
            target/release/vellux-pkg
            target/release/vellux-compositor
            target/release/vellux-shell
            target/release/vellux-term
            target/release/vellux-files
            target/release/vellux-settings

  # ============================================================================
  # STEP 2: ASSEMBLE LIVE ROOTFS & MASTER BOOTABLE HYBRID ISO
  # ============================================================================
  master-live-iso:
    name: Build Live Linux Rootfs & Master ISO
    needs: build-rust-subsystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install ISO Mastering Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools debootstrap

      - name: Download Compiled Native Binaries
        uses: actions/download-artifact@v4
        with:
          name: vellux-native-binaries
          path: bin-artifacts

      - name: Make Binaries Executable
        run: chmod +x bin-artifacts/*

      - name: Construct Base Rootfs Skeleton
        run: |
          mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,tmp,usr/bin,usr/lib,boot/grub,var/lib/vellux}
          cp bin-artifacts/vellux-pkg rootfs/usr/bin/
          cp bin-artifacts/vellux-compositor rootfs/usr/bin/
          cp bin-artifacts/vellux-shell rootfs/usr/bin/
          cp bin-artifacts/vellux-term rootfs/usr/bin/
          cp bin-artifacts/vellux-files rootfs/usr/bin/
          cp bin-artifacts/vellux-settings rootfs/usr/bin/
          
          # Install compositor configurations & GLSL shaders
          mkdir -p rootfs/etc/vellux/shaders
          cp compositor/config/vellux-comp.conf rootfs/etc/vellux/
          cp compositor/shaders/dual_kawase.frag rootfs/etc/vellux/shaders/

          # Basic system identification
          cat << 'EOF' > rootfs/etc/os-release
          NAME="Vellux OS"
          PRETTY_NAME="Vellux OS 1.0 (Wayland 144Hz Fluid Glass)"
          ID=vellux
          ID_LIKE=linux
          VERSION="1.0"
          HOME_URL="https://github.com/Omerfaruk-aydn/Vellux-OS"
          EOF

      - name: Build Hybrid UEFI/BIOS ISO Image
        run: |
          mkdir -p iso_root/{boot/grub,live}
          
          # Compress rootfs to Zstandard SquashFS
          mksquashfs rootfs iso_root/live/filesystem.squashfs -comp zstd -Xcompression-level 19

          # Write GRUB configuration
          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set default=0
          set timeout=5
          insmod efi_gop
          insmod font
          insmod gfxterm
          set gfxmode=auto
          terminal_output gfxterm

          menuentry "Start Vellux OS 1.0 (Pure Wayland - 120Hz/144Hz Fluid Glass)" {
              echo "Booting Vellux OS..."
              linux /live/vmlinuz quiet splash
              initrd /live/initrd.img
          }
          EOF

          # Generate ISO using xorriso
          mkdir -p dist
          grub-mkrescue -o dist/Vellux-OS-1.0-x86_64.iso iso_root

      - name: Upload Finished ISO Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellux-OS-Live-ISO
          path: dist/Vellux-OS-1.0-x86_64.iso

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build
          name: "Vellux OS 1.0.0 Build"
          body: |
            ### 🌌 Vellux OS 1.0.0 Official Release

            - **Compositor:** Pure Wayland native direct-scanout compositor (144Hz VRR)
            - **Shaders:** Hardware-accelerated Dual-Kawase GLSL background blur
            - **Physics:** Symplectic semi-implicit Euler Hooke mass-spring solver
            - **Package Engine:** `vellux-pkg` with SQLite3 WAL database & topological dependency resolver
            - **Native Apps Suite:**
              * `vellux-term`: GPU-accelerated glass terminal
              * `vellux-files`: Native glass file manager (Finder)
              * `vellux-settings`: Hardware & visual display preferences
          files: dist/Vellux-OS-1.0-x86_64.iso
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
